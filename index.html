<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>தமிழ் வினாடி வினா</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="quiz-container">

    <h1>📝 தமிழ் வினாடி வினா</h1>
        <!-- மாணவர் விவரம் -->

    <input
        type="text"
        id="studentName"
        placeholder="மாணவர் பெயர்"
    >

    <input
        type="text"
        id="studentClass"
        placeholder="வகுப்பு"
    >

    <!-- Timer -->

    <div id="timer">
        ⏱️ மீதமுள்ள நேரம்: 10:00
    </div>

    <!-- Questions -->

    <div id="quiz"></div>
