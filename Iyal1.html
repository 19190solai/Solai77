<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>இயல் 1 - தமிழ் வினாடி வினா</title>

    <link rel="stylesheet" href="iyal1.css">
</head>

<body>

<div class="quiz-container">

    <h1>📚 தமிழ் - இயல் 1</h1>
    <h2>வினாடி வினா</h2>

    <div class="student-info">
        <input type="text" id="studentName" placeholder="மாணவர் பெயர்">
        <input type="text" id="studentClass" placeholder="வகுப்பு">
    </div>

    <div class="top-bar">
        <span id="questionNumber">வினா 1</span>
        <span id="timer">⏱️ 10:00</span>
    </div>

    <div id="quiz"></div>

    <button id="nextBtn" onclick="nextQuestion()">
        அடுத்த வினா ➡️
    </button>

    <button id="submitBtn" onclick="submitQuiz()" style="display:none;">
        தேர்வை முடிக்கவும்
    </button>

    <div id="result"></div>

</div>

<script src="iyal1.js"></script>

</body>
</html>
